<details class="card"><summary>Corrigir interpretação · cria nova versão</summary><p>A versão anterior será preservada. Evidências e prazos serão verificados novamente.</p><form method="post" action="/obligations/{{item.id}}/review"><input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="action" value="correct"><input type="hidden" name="expected_count" value="{{data.decisions_count}}"><label>Sujeito<input name="correction_subject" value="{{candidate.subject}}" required></label><label>Modalidade<select name="correction_modality">{% for value in ['duty','prohibition','permission'] %}<option value="{{value}}" {% if candidate.modality == value %}selected{% endif %}>{{value|label}}</option>{% endfor %}</select></label><label>Ação<textarea name="correction_action" rows="4" required>{{candidate.action}}</textarea></label><label>Objeto<input name="correction_object" value="{{candidate.object}}" required></label><label>Condições · uma por linha<textarea name="correction_conditions" rows="2">{{candidate.conditions|join('\n')}}</textarea></label><label>Exceções · uma por linha<textarea name="correction_exceptions" rows="2">{{candidate.exceptions|join('\n')}}</textarea></label><input type="hidden" name="anchor_count" value="{{candidate.evidence|length}}">{% for anchor in candidate.evidence %}<div class="callout"><label>Unidade de evidência {{loop.index}}<input name="anchor_unit_{{loop.index0}}" value="{{anchor.unit_id}}" required></label><label>Trecho literal {{loop.index}}<textarea name="anchor_quote_{{loop.index0}}" rows="3" required>{{anchor.quote}}</textarea></label></div>{% endfor %}<details><summary>Acrescentar outro fundamento deste documento</summary><label>Unidade adicional<input name="anchor_unit_{{candidate.evidence|length}}"></label><label>Trecho literal adicional<textarea name="anchor_quote_{{candidate.evidence|length}}" rows="3"></textarea></label></details><label>Justificativa da correção<textarea name="reason" rows="2" required></textarea></label><button class="primary">Salvar nova interpretação</button></form></details>
