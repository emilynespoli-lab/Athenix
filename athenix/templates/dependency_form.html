{% if extracted and extracted.links %}<details class="card"><summary>Associar documento recebido a um link inventariado</summary><p>Correspondência declarada por pessoa. Obtido e interpretado por software são estados distintos; nenhum comprova validação jurídica.</p><form method="post" action="/documents/{{doc.id}}/dependencies"><input type="hidden" name="csrf" value="{{csrf}}"><label>Referência<select name="link_id">{% for link in extracted.links %}<option value="{{link.id}}">{{link.label}} · {{link.state}}</option>{% endfor %}</select></label><label>Documento recebido<select name="target_id" required>{% for target in documents if target.id != doc.id %}<option value="{{target.id}}">{{target.title}}</option>{% endfor %}</select></label><label>Justificativa da associação<input name="reason" required></label><button>Registrar associação</button></form></details>{% endif %}
